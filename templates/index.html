<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Task Dashboard</title>
    <link rel="stylesheet" href="/styles/style.css">
</head>
<body>
<div class="login-box">
    <h2>Login</h2>
    <form id="loginForm">
        <input type="text" id="username" placeholder="Username" autocomplete="username" required>
        <input type="password" id="password" placeholder="Password" autocomplete="current-password" required>
        <button type="submit">Log In</button>
        <p id="error-message">Login failed. Try again.</p>
    </form>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', async function (e) {
        e.preventDefault();
        const errorEl = document.getElementById('error-message');
        errorEl.style.display = 'none';

        // /token uses the standard OAuth2 password flow: form-encoded, not JSON.
        const body = new URLSearchParams({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value
        });

        try {
            const response = await fetch('/token', { method: 'POST', body });
            const data = await response.json().catch(() => ({}));

            if (response.ok && data.access_token) {
                localStorage.setItem('token', data.access_token);
                localStorage.setItem('role', data.role);
                window.location.href = '/dashboard';
                return;
            }
            errorEl.textContent = typeof data.detail === 'string' ? data.detail : 'Login failed. Try again.';
        } catch (error) {
            errorEl.textContent = 'Could not reach the server. Try again.';
        }
        errorEl.style.display = 'block';
    });
</script>
</body>
</html>
